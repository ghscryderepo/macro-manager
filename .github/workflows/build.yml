name: Build Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore WindowsMacroManager.csproj -r win-x64
      - name: Build
        run: dotnet build WindowsMacroManager.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained executable
        run: dotnet publish WindowsMacroManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o publish
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WindowsMacroManager-win-x64
          path: publish/WindowsMacroManager.exe
          if-no-files-found: error
